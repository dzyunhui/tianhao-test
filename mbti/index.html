function pick(i){ans[cur]=i;render()}
function next(){
 if(ans[cur]===null){document.getElementById("msg").style.display="block";return}
 if(cur===19){result()}else{cur++;render()}
}
function prev(){if(cur>0){cur--;render()}}
function result(){
 var sc={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
 ans.forEach(function(a,i){
  var d=QS[i].d;
  var o={E:"I",S:"N",T:"F",J:"P"}[d];
  if(a===1)sc[d]++; else if(o)sc[o]++;
 });
 var pairs=[["E","I"],["S","N"],["T","F"],["J","P"]],type="",dh="";
 pairs.forEach(function(p){
  var a=sc[p[0]],b=sc[p[1]],t=a+b||1;
  type+=(a>=b?p[0]:p[1]);
  var pct=Math.round(Math.max(a,b)/t*100);
  dh+='<div class="dim"><b>'+p[0]+'</b><div class="track"><i class="'+(a>=b?"":"l")+'" style="width:'+pct+'%"></i></div><b>'+p[1]+'</b><span>'+LBL[a>=b?p[0]:p[1]]+' '+pct+'%</span></div>';
 });
 var r=RES[type]||RES.INFP;
 document.getElementById("r-type").textContent=type;
 document.getElementById("r-one").textContent=r.one;
 document.getElementById("r-dims").innerHTML=dh;
 document.getElementById("r-portrait").textContent=r.portrait;
 document.getElementById("r-trap").textContent=r.trap;
 var sh="";
 [["事业",r.s.事业],["情感",r.s.情感],["家庭",r.s.家庭],["学习",r.s.学习]].forEach(function(x){
  sh+='<div class="sec" style="margin:14px 0"><h4>'+x[0]+'</h4><p>'+x[1]+"</p></div>";
 });
 document.getElementById("r-scenes").innerHTML=sh;
 show("s-result");
}
</script>
</body>
</html>
