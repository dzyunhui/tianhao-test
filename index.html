<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>讨好型人格自查表</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Source Han Sans CN", sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    line-height: 1.7;
    padding: 32px 16px 60px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .issue { text-align:center; font-size:12px; letter-spacing:3px; color:#86868b; margin-bottom:10px; }
  h1 { text-align:center; font-size:30px; font-weight:700; letter-spacing:-0.5px; }
  .sub { text-align:center; font-size:15px; color:#86868b; margin-top:10px; }
  .divider { text-align:center; color:#c7c7cc; font-size:13px; letter-spacing:4px; margin:26px 0; }
  .intro {
    background:#fff; border-radius:14px; padding:18px 20px; margin-bottom:22px;
    font-size:14px; color:#515154; box-shadow:0 1px 4px rgba(0,0,0,0.04);
  }
  .intro b { color:#1d1d1f; }
  .q {
    background:#fff; border-radius:14px; padding:18px 20px; margin-bottom:14px;
    box-shadow:0 1px 4px rgba(0,0,0,0.04);
  }
  .q .qt { font-size:15px; margin-bottom:12px; color:#1d1d1f; }
  .q .qt span { color:#0071e3; font-weight:600; margin-right:6px; }
  .opts { display:flex; gap:8px; }
  .opt {
    flex:1; text-align:center; padding:9px 0; border:1px solid #d2d2d7; border-radius:9px;
    font-size:13px; color:#515154; cursor:pointer; transition:all .15s; user-select:none;
  }
  .opt:hover { border-color:#0071e3; }
  .opt.on { background:#0071e3; border-color:#0071e3; color:#fff; }
  .btn {
    display:block; width:100%; margin-top:26px; padding:15px 0; border:none; border-radius:12px;
    background:#0071e3; color:#fff; font-size:16px; font-weight:600; cursor:pointer; transition:opacity .15s;
  }
  .btn:hover { opacity:.88; }
  .btn:disabled { background:#c7c7cc; cursor:not-allowed; }
  .tip { text-align:center; font-size:12px; color:#86868b; margin-top:12px; }
  /* 结果 */
  #result { display:none; margin-top:28px; }
  .score-card {
    background:linear-gradient(135deg,#1d1d1f,#3a3a3c); border-radius:18px;
    padding:30px 24px; text-align:center; color:#fff;
  }
  .score-card .label { font-size:13px; letter-spacing:2px; color:#98989d; }
  .score-card .num { font-size:56px; font-weight:700; margin:6px 0 2px; letter-spacing:-2px; }
  .score-card .total { font-size:14px; color:#98989d; }
  .level-tag {
    display:inline-block; margin-top:16px; padding:5px 14px; border-radius:20px;
    font-size:13px; font-weight:600;
  }
  .comment { background:#fff; border-radius:14px; padding:22px 20px; margin-top:16px; box-shadow:0 1px 4px rgba(0,0,0,0.04); }
  .comment h3 { font-size:18px; margin-bottom:12px; }
  .comment p { font-size:15px; color:#3a3a3c; margin-bottom:10px; }
  .comment .advice { background:#f5f5f7; border-radius:10px; padding:14px 16px; font-size:14px; color:#424245; margin-top:6px; }
  .comment .advice b { color:#0071e3; }
  .again { text-align:center; font-size:13px; color:#0071e3; margin-top:18px; cursor:pointer; }
  .foot { text-align:center; font-size:12px; color:#aeaeb2; margin-top:34px; line-height:1.8; }
</style>
</head>
<body>
<div class="wrap">
  <div class="issue">醒着 · 自查</div>
  <h1>讨好型人格自查表</h1>
  <div class="sub">12 道题，看看你是不是太委屈自己了</div>
  <div class="divider">— · —</div>

  <div class="intro">
    凭<b>第一反应</b>作答，别纠结「标准答案」。每题按你的真实情况选：<b>很少 / 有时 / 经常</b>。约 1 分钟。
  </div>

  <div id="quiz"></div>

  <button class="btn" id="submit" onclick="calc()">查看我的结果</button>
  <div class="tip" id="tip">答完 12 题即可查看</div>

  <div id="result">
    <div class="score-card">
      <div class="label">你的讨好指数</div>
      <div class="num"><span id="scoreNum">0</span></div>
      <div class="total">满分 36 分</div>
      <div><span class="level-tag" id="levelTag">—</span></div>
    </div>
    <div class="comment">
      <h3 id="cTitle"></h3>
      <div id="cBody"></div>
      <div class="advice" id="cAdv"></div>
    </div>
    <div class="again" onclick="reset()">↻ 重新测一次</div>
  </div>

  <div class="foot">
    本表为自我觉察工具，非正式心理诊断。<br>如长期困扰，建议寻求专业心理咨询。
  </div>
</div>

<script>
const questions = [
  "别人开口求助时，即使很不情愿，我也很难说「不」。",
  "我常因为担心对方不高兴，而附和自己并不认同的观点。",
  "拒绝别人后，我会内疚很久，反复想是不是做得不对。",
  "我总是先顾及别人的感受，自己的需求排在最后。",
  "我很在意别人怎么看我，怕被评价为「不好相处」。",
  "聊天时我更常当倾听者，很少主动表达自己的需要。",
  "我容易为别人的情绪负责，觉得「是不是我造成的」。",
  "为了维持关系，我会做很多自己其实不想做的事。",
  "被夸「脾气好、好说话」时，我心里其实并不舒服。",
  "我害怕表达真实想法会惹人生气或破坏关系。",
  "别人一个冷淡的回应，我会反复琢磨是不是我做错了。",
  "独处时我常觉得累，却说不清这份累从哪来。"
];
const opts = [["很少",0],["有时",1],["经常",2]];
const quiz = document.getElementById('quiz');
const answers = new Array(questions.length).fill(null);

questions.forEach((q,i)=>{
  const div = document.createElement('div');
  div.className='q';
  let optHtml = opts.map((o,j)=>`<div class="opt" data-v="${o[1]}" onclick="pick(${i},${j},this)">${o[0]}</div>`).join('');
  div.innerHTML = `<div class="qt"><span>${String(i+1).padStart(2,'0')}</span>${q}</div><div class="opts">${optHtml}</div>`;
  quiz.appendChild(div);
});

function pick(qi, oi, el){
  answers[qi]=opts[oi][1];
  el.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));
  el.classList.add('on');
  checkDone();
}
function checkDone(){
  const done = answers.filter(a=>a!==null).length;
  const btn=document.getElementById('submit');
  const tip=document.getElementById('tip');
  if(done===questions.length){ btn.disabled=false; tip.textContent='全部答完，点下方查看结果'; }
  else { btn.disabled=true; tip.textContent=`已答 ${done}/${questions.length} 题`; }
}
checkDone();

const levels = [
  {max:12, tag:"边界清晰 · 低讨好", color:"#34a853", title:"你很懂得照顾自己",
   body:"你能分清「别人的事」和「我的事」，该拒绝时拒绝得出来，也不太被评价绑架。这是很珍贵的能力。",
   adv:"<b>提醒：</b>偶尔也留意那些你「顺手就答应」的小事——低讨好的人，最容易在这些不经意的角落里悄悄付出。"},
  {max:24, tag:"偶尔委屈 · 中度讨好", color:"#ff9f0a", title:"你有一半时间在迁就别人",
   body:"多数时候你相处得体，但在关系近的人、或在意的人面前，你还是会压下真实想法，事后又有点闷。你的「好说话」里，藏着一些没说出口的委屈。",
   adv:"<b>试试：</b>这周找一件小事，练习一句温和的拒绝——「我想帮，但今天实在排不开」。你会发现，天地没塌，对方也没走。"},
  {max:32, tag:"明显讨好 · 高讨好", color:"#ff453a", title:"你在用「懂事」消耗自己",
   body:"你习惯把别人的需求放在自己前面，用「不麻烦别人」「让大家都舒服」来换一份安全感。代价是——你越来越不知道自己到底想要什么，累、空、又难以开口。",
   adv:"<b>先从一件事开始：</b>每天记下一个「我其实不想做但还是做了」的时刻。看见它，就是松绑的第一步。你值得被喜欢，也值得被自己偏袒。"},
  {max:36, tag:"高度讨好 · 请好好待自己", color:"#bf5af2", title:"你几乎把自己弄丢了",
   body:"在关系里你几乎全程在迎合、在警觉、在自我审查。你的疲惫和空洞不是矫情，是你太久没被允许「只做自己」。这份自查表，可能已经让你有点难受了。",
   adv:"<b>请当真：</b>你不必一个人扛。认真考虑找一位专业咨询师聊聊，比任何自查表都更能帮到你。你不是有问题，你是太久没被好好接住了。"}
];

function calc(){
  const total = answers.reduce((a,b)=>a+(b||0),0);
  const lv = levels.find(l=>total<=l.max) || levels[levels.length-1];
  document.getElementById('scoreNum').textContent = total;
  const tag=document.getElementById('levelTag');
  tag.textContent = lv.tag; tag.style.background = lv.color+'22'; tag.style.color = lv.color;
  document.getElementById('cTitle').textContent = lv.title;
  document.getElementById('cBody').innerHTML = '<p>'+lv.body+'</p>';
  document.getElementById('cAdv').innerHTML = lv.adv;
  document.getElementById('result').style.display='block';
  document.getElementById('submit').style.display='none';
  document.getElementById('tip').style.display='none';
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
}
function reset(){
  answers.fill(null);
  quiz.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));
  document.getElementById('result').style.display='none';
  document.getElementById('submit').style.display='block';
  document.getElementById('tip').style.display='block';
  checkDone();
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
